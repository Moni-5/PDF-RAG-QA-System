[project]
name = "pdf-rag-qa-system"
version = "0.1.0"
description = "A Retrieval-Augmented Generation system for question answering over research papers"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "chromadb>=1.5.9",
    "google-generativeai>=0.8.6",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.4.6",
    "pydantic[email]>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
