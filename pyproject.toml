[project]
name = "hons-assessment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Moni-5", email = "monishallam01@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "google-generativeai>=0.8.6",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-cohere>=0.6.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.8",
    "langsmith>=0.12.4",
    "notebook>=7.6.2",
    "numpy>=2.4.6",
    "pydantic[email]>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.63.0",
    "tavily-python>=0.8.3",
]

[project.scripts]
hons-assessment = "hons_assessment:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
